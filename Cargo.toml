[package]
name = "ferrocrypt"
version = "0.1.0"
edition = "2024"

[dependencies]
# TUI and Terminal handling
ratatui = "0.26"
crossterm = "0.27"

# Cryptography
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async and Networking
tokio = { version = "1.0", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
hex = "0.4"

# Utility
rpassword = "7.3" # For secure master password entry